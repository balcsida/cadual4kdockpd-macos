# Builds the Windows app: one exe, the Rust engine with its Win32 window (`--features window`), without
# any firmware. The run also starts the app once and keeps a picture of the screen, because nobody can
# see it start here.
# Results: the artifacts "CADUAL4KDOCKPD-Patch-windows" (one exe) and "window-picture".
# Publishing a release on GitHub runs this too and attaches the exe to it, for anyone to download.
name: Windows app

on:
  push:
    paths:
      - cadual4kdockpd-patch/**
      - .github/workflows/windows-app.yml
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cadual4kdockpd-patch
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --features window
      - run: cargo build --release --features window
      - name: Name the app
        shell: powershell
        run: |
          New-Item -ItemType Directory app | Out-Null
          Copy-Item target\release\cadual4kdockpd-patch.exe app\CADUAL4KDOCKPD-Patch-App.exe
      - name: Start the app and take a picture of the screen
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          $errorFile = Join-Path $env:TEMP 'CADUAL4KDOCKPD-Patch-error.txt'
          function Test-Start($exe, $pictureFile, $mainPictureFile) {
            $app = Start-Process -FilePath $exe -PassThru -RedirectStandardError app-stderr.txt -RedirectStandardOutput app-stdout.txt
            foreach ($second in 1..60) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited -or $app.MainWindowHandle -ne 0) { break }
            }
            Write-Host "${exe}: waited $second s for the window"
            Start-Sleep -Seconds 6
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $picture = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($picture).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $picture.Save("$PWD\$pictureFile")
            $app.Refresh()
            # the engine is this same exe, started by the window as "serve"
            $engine = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($app.Id)" | Where-Object { $_.CommandLine -like '* serve' }
            $problem = if (Test-Path $errorFile) { Get-Content $errorFile -Raw }
              elseif ($app.HasExited) { "the app exited with code $($app.ExitCode)" }
              elseif ($app.MainWindowHandle -eq 0) { 'the app is running but has no window' }
              elseif (-not $engine) { 'the app did not start its engine' }
            if (-not $problem) {
              # What the app's windows show, read the way a screen reader would. The engine built here has
              # no firmware image and says so; that sentence on screen proves its reports reach the window.
              # It is in "More options", a window of its own, so every window of the app is read.
              $auto = [System.Windows.Automation.AutomationElement]
              $mine = New-Object System.Windows.Automation.PropertyCondition($auto::ProcessIdProperty, $app.Id)
              $shown = $auto::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $mine) | ForEach-Object {
                $_.Current.Name
                $_.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name }
              }
              if (-not ($shown -like '*Looking for the dock*')) { $problem = "the window does not show step 1. It shows: $($shown -join ' | ')" }
              elseif (-not ($shown -like '*tps65982-image*')) { $problem = "the window does not show what the engine reports. It shows: $($shown -join ' | ')" }
            }
            if (-not $problem -and $mainPictureFile) {
              # "More options" opened over the flow; closing it only hides it, and shows the flow. It is
              # owned by the main window, so UI Automation lists it below that window, not the desktop.
              $more = $auto::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition($mine,
                (New-Object System.Windows.Automation.PropertyCondition($auto::NameProperty, 'More options')))))
              $more.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern).Close()
              Start-Sleep -Seconds 2
              [System.Drawing.Graphics]::FromImage($picture).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
              $picture.Save("$PWD\$mainPictureFile")
              $app.Refresh()
              if ($app.HasExited) { $problem = 'closing More options closed the app' }
            }
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            Start-Sleep -Seconds 4
            if (-not $problem -and (Get-Process -Id $engine.ProcessId -ErrorAction SilentlyContinue)) { $problem = 'the engine kept running after the window was gone' }
            if ($problem) {
              Write-Host "FAILED: ${exe}: $problem"
              Write-Host "--- what the app wrote"; Get-Content app-stderr.txt, app-stdout.txt -ErrorAction SilentlyContinue
              Write-Host "--- event log"
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-4) } -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -in 'Application Error', 'Windows Error Reporting' } |
                Format-List TimeCreated, ProviderName, Message
              exit 1
            }
            Write-Host "${exe}: started, shows the engine's report, and the engine ends with it"
          }
          Get-ChildItem app | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }
          Test-Start 'app\CADUAL4KDOCKPD-Patch-App.exe' 'window.png' 'window-main.png'
          # A build for internal use gets a firmware image attached to the end of the exe, and people
          # rename files. Neither may stop the app from starting; stand-in bytes are enough to test that.
          New-Item -ItemType Directory other | Out-Null
          $attached = "$PWD\other\CADUAL4KDOCKPD-Patch-App.exe"
          Copy-Item app\CADUAL4KDOCKPD-Patch-App.exe $attached
          $bytes = New-Object byte[] 168580
          (New-Object Random 1).NextBytes($bytes)
          $stream = [IO.File]::Open($attached, 'Append')
          $stream.Write($bytes, 0, $bytes.Length)
          $stream.Close()
          Test-Start $attached 'window-attached.png'
          $renamed = "$PWD\other\CADUAL4KDOCKPD Patch (1).exe"
          Copy-Item $attached $renamed
          Test-Start $renamed 'window-renamed.png'
      - name: Take a picture of each step, from the engine output of serve.rs's demo test
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type -ReferencedAssemblies Accessibility -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using Accessibility;
          public static class Msaa {
              [DllImport("oleacc.dll")]
              static extern int AccessibleObjectFromWindow(IntPtr hwnd, uint objectId, ref Guid iid, [MarshalAs(UnmanagedType.IUnknown)] out object accessible);
              static IAccessible Of(IntPtr hwnd) {
                  Guid iid = new Guid("618736E0-3C3D-11CF-810C-00AA00389B71");
                  object accessible;
                  AccessibleObjectFromWindow(hwnd, 0xFFFFFFFC, ref iid, out accessible);
                  return (IAccessible)accessible;
              }
              public static int Role(IntPtr hwnd) { return Convert.ToInt32(Of(hwnd).get_accRole(0)); }
              public static string Name(IntPtr hwnd) { return Of(hwnd).get_accName(0); }
              public static void Press(IntPtr hwnd) { Of(hwnd).accDoDefaultAction(0); }
          }
          '@
          $auto = [System.Windows.Automation.AutomationElement]
          New-Item -ItemType Directory demo | Out-Null
          $env:DOCK_DEMO_DIR = "$PWD\demo"
          cargo test -- --ignored demo
          # a debug build: only that one reads DOCK_UI_DEMO
          cargo build --features window
          foreach ($state in 'identify', 'patch', 'writing', 'failed', 'restart', 'test') {
            $env:DOCK_UI_DEMO = "$PWD\demo\$state.jsonl"
            $app = Start-Process -FilePath target\debug\cadual4kdockpd-patch.exe -PassThru
            foreach ($second in 1..30) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited -or $app.MainWindowHandle -ne 0) { break }
            }
            if ($app.HasExited) { Write-Host "FAILED: the window for $state exited with code $($app.ExitCode)"; exit 1 }
            Start-Sleep -Seconds 2
            if ($state -eq 'writing') {
              # What a screen reader is told about each control, through MSAA as NVDA reads Win32
              # controls; then the log box is opened the way a screen reader user would open it.
              $roles = @{ 10 = 'client'; 40 = 'graphic'; 41 = 'text'; 42 = 'field'; 43 = 'button'; 44 = 'checkbox'; 48 = 'progress bar' }
              $details = [IntPtr]::Zero
              $auto::FromHandle($app.MainWindowHandle).FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition) | ForEach-Object {
                $hwnd = [IntPtr]$_.Current.NativeWindowHandle
                if ($hwnd -eq [IntPtr]::Zero) { return }
                $role = [Msaa]::Role($hwnd)
                $name = [Msaa]::Name($hwnd)
                $kind = $roles[$role]
                if (-not $kind) { $kind = "role $role" }
                Write-Host "  $kind`: $name"
                if ($role -eq 43 -and $name -eq 'Show details') { $details = $hwnd }
              }
              if ($details -eq [IntPtr]::Zero) { Write-Host "FAILED: no button named Show details"; exit 1 }
              [Msaa]::Press($details)
              Start-Sleep -Seconds 1
            }
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $picture = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($picture).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $picture.Save("$PWD\window-step-$state.png")
            Stop-Process -Id $app.Id -Force
            Write-Host "pictured: $state"
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: window-picture
          path: cadual4kdockpd-patch/window*.png
      - uses: actions/upload-artifact@v7
        with:
          name: CADUAL4KDOCKPD-Patch-windows
          path: cadual4kdockpd-patch/app/CADUAL4KDOCKPD-Patch-App.exe
      - name: Attach the exe to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" app/CADUAL4KDOCKPD-Patch-App.exe --clobber
